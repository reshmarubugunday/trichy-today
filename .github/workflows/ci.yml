name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx eslint .

      - run: npm run build
        env:
          # Placeholder values — the build never makes a real network call to
          # Supabase (data-layer functions read cookies() first, which bails
          # Next.js out of static rendering before any Supabase call runs).
          # These just need to be non-empty/well-formed to satisfy env.ts and
          # the Supabase client constructors during the /login prerender.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
